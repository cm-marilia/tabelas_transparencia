<!-- ===========================================================================
     SEÇÃO "MANIFESTAÇÕES E OUVIDORIA" — SITE OFICIAL
     Câmara Municipal de Marília | https://www.marilia.sp.leg.br/

     O QUE É ESTE CÓDIGO
     Iframe que incorpora o dashboard de manifestações da Ouvidoria
     hospedado no GitHub Pages + script que ajusta a altura do iframe
     automaticamente. Sem texto explicativo antes do painel (decisão do
     usuário) — se um dia adicionar texto no editor do site, cole-o antes
     deste bloco.

     ⚠️ IMPORTANTE: se for adicionar estilos, use apenas estilos INLINE —
     o editor do site remove blocos <style> ao salvar.

     MANUTENÇÃO RÁPIDA
     - Endereço do painel ........ src do iframe:
       https://cm-marilia.github.io/tabelas_transparencia/paginas/painel_manifestacoes.html
       (repo cm-marilia/tabelas_transparencia, pasta paginas/)
     =========================================================================== -->

<!-- ========================================================================
     IFRAME — dashboard hospedado no GitHub Pages
     A altura inicial (1400px) vale só até a primeira mensagem do painel;
     depois disso o script abaixo ajusta a altura automaticamente. Sem
     "scrolling=no" de propósito: se a mensagem de altura não chegar (erro
     de script no painel, bloqueio de rede), o iframe rola internamente e
     nada é cortado. Quando o ajuste funciona, a altura fica exata e não
     há rolagem.
     ======================================================================== -->
<iframe
    id="iframe-painel_manifestacoes"
    src="https://cm-marilia.github.io/tabelas_transparencia/paginas/painel_manifestacoes.html"
    loading="lazy"
    style="border: none; width: 1px; min-width: 100%; height: 1400px; transition: height 0.3s ease-in-out;"
    title="Dashboard de Manifestações e Ouvidoria - Câmara Municipal de Marília">
</iframe>

<!-- ========================================================================
     SCRIPT — ajuste automático de altura do iframe
     Proteções: só aceita mensagens do GitHub Pages oficial (event.origin),
     vindas DESTE iframe (event.source), com altura numérica válida.
     ======================================================================== -->
<script>
    window.addEventListener('message', function(event) {
        if (event.origin !== "https://cm-marilia.github.io") return;

        var iframe = document.getElementById('iframe-painel_manifestacoes');
        if (!iframe || event.source !== iframe.contentWindow) return;

        if (event.data && event.data.tipo === 'ajustarAltura') {
            var altura = parseInt(event.data.valor, 10);
            if (!isNaN(altura) && altura > 200) {
                iframe.style.height = altura + 'px';
            }
        }
    }, false);
</script>
