<!DOCTYPE html>
<!-- ===========================================================================
     RELATÓRIO DE CONTRATOS — Câmara Municipal de Marília
     ===========================================================================
     Exibe os contratos celebrados pela Câmara, em cards, com busca livre
     (razão social, CNPJ/CPF, número, objeto), filtros por ano, fiscal,
     situação, modalidade e mês, botões de acesso ao inteiro teor (PDF) e à
     pasta do contrato (SAPL), exportação (CSV/Excel/JSON/XML) e impressão.
     Hospedada no GitHub Pages e incorporada via <iframe> no site oficial
     (marilia.sp.leg.br).

     Os dados vêm de abas por ano de uma planilha do Google Sheets, publicadas
     como CSV — ver FONTES_POR_ANO, logo no início do <script> abaixo. Como
     adicionar um ano novo: ver COMO-ADICIONAR-UM-ANO.md no repositório.

     Situação: usa situacao_contrato da planilha se preenchida (ex.:
     "Rescindido" — fato permanente, nunca recalculado); senão compara
     data_fim_vigencia com hoje ("Vigente"/"Encerrado"; "INDETERMINADA" ou
     vazio conta como vigente). Ordenação dos cards: vigentes → rescindidos →
     encerrados; dentro de cada grupo, contrato mais novo primeiro. CPF é
     mascarado na tela e nas exportações; CNPJ aparece completo (dado
     público).

     Estilo e funções compartilhadas com as outras páginas: comum.css e
     comum.js. Formato esperado da planilha: padrao-planilhas.md.
     =========================================================================== -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contratos</title>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="comum.css" />

    <style>
        /* Cores dos botões de link externo — a estrutura (.container-links,
           .btn-link-externo) vem de comum.css. */
        .btn-pdf { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
        .btn-pdf:hover { background: #fee2e2; border-color: #fca5a5; }
        .btn-sapl { background: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
        .btn-sapl:hover { background: #dcfce7; border-color: #86efac; }
    </style>
</head>
<body>

<div id="wrapper">

    <header class="topo">
        <h1>Contratos</h1>
        <div class="logo-container">
            <img src="../brasao_marilia.png" alt="Brasão de Marília" width="50" height="50" class="brasao">
            <span class="texto-camara">Câmara Municipal de Marília</span>
        </div>
    </header>

    <div id="cabecalho-impressao">
        <img src="../brasao_marilia.png" width="63" height="70" alt="Brasão de Marília">
        <div>
            <h1 style="margin:0; color:#003b75;">Contratos</h1>
            <p style="margin:0; font-weight:bold;">Câmara Municipal de Marília</p>
        </div>
    </div>

    <div id="loader" role="status" aria-live="polite">
        <div class="spinner"></div>
        <span>Carregando base de dados de contratos...</span>
    </div>

    <main class="container" id="main-container" style="display: none;">

        <fieldset class="painel-grupo">
            <legend class="titulo-painel titulo-painel--com-selo">
                Filtros de Pesquisa
                <span id="badge-atualizacao" class="badge-atualizacao">⏳ Sincronizando...</span>
            </legend>

            <div class="painel-filtros">
                <input type="text" id="filtroTexto" class="span-2" placeholder="Pesquisar por razão social, CNPJ/CPF, contrato, objeto..." autocomplete="off" aria-label="Pesquisa livre">
                <select id="filtroFiscal" aria-label="Filtrar por Fiscal">
                    <option value="">Fiscal</option>
                </select>
                <select id="filtroStatus" aria-label="Filtrar por Situação">
                    <option value="">Situação</option>
                </select>

                <select id="filtroModalidade" aria-label="Filtrar por Modalidade">
                    <option value="">Modalidade</option>
                </select>
                <select id="filtroMes" aria-label="Filtrar por Mês de assinatura">
                    <option value="">Mês (assinatura)</option>
                    <option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option>
                    <option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option>
                    <option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option>
                    <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                </select>

                <button class="btn-filtro" onclick="limparFiltros()">Limpar filtros</button>
            </div>
        </fieldset>

        <fieldset class="painel-grupo">
            <legend class="titulo-painel">Exportação e Impressão</legend>
            <div class="painel-exportacao">
                <button onclick="exportarCSV()">⬇️ CSV</button>
                <button onclick="exportarXLSX()">⬇️ Excel</button>
                <button onclick="exportarJSON()">⬇️ JSON</button>
                <button onclick="exportarXML()">⬇️ XML</button>
                <button class="btn-acao" onclick="imprimirSeguro()">🖨️ Imprimir</button>
            </div>
        </fieldset>

        <fieldset class="painel-grupo" id="painel-visualizacao" style="padding: 10px 15px;">
            <legend class="titulo-painel">Visualização</legend>
            <div class="dt-custom-header">
                <div id="comprimento-tabela"></div>
                <div id="contagem-registros" class="badge-contagem">0 registros encontrados</div>
            </div>
        </fieldset>

        <table id="tabela" style="width:100%" role="presentation">
            <thead><tr><th>Dados dos Contratos</th></tr></thead>
            <tbody></tbody>
        </table>
    </main>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>window.ORIGEM_PAI = "https://www.marilia.sp.leg.br";</script>
<script src="comum.js"></script>

<script>
    /* removerAcentos, escapeHtml, escapeXml, urlValida, mascararCPF,
       parseNumeroBR, formatarBRL, dataParaTimestamp, buscarCSV,
       indexarColunas, enviarAlturaIframe e o objeto Exportar vêm de
       comum.js. */

    // ==== CONFIGURAÇÃO =====================================================

    // FONTES DE DADOS — uma URL de CSV por ano do contrato.
    // Para adicionar um ano novo: ver COMO-ADICIONAR-UM-ANO.md no repositório.
    const FONTES_POR_ANO = {
        "2026": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTC0zhyE197NKdqTGabsdv_Ofj9E7HtwcoGZ2_Ll-CLHcIeOm4GyIHdqChDp36c1pKpj7Bm1bUB-Uqp/pub?gid=47019203&single=true&output=csv",
        "2025": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTC0zhyE197NKdqTGabsdv_Ofj9E7HtwcoGZ2_Ll-CLHcIeOm4GyIHdqChDp36c1pKpj7Bm1bUB-Uqp/pub?gid=1922578156&single=true&output=csv",
        "2024": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTC0zhyE197NKdqTGabsdv_Ofj9E7HtwcoGZ2_Ll-CLHcIeOm4GyIHdqChDp36c1pKpj7Bm1bUB-Uqp/pub?gid=789937754&single=true&output=csv",
        "2023": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTC0zhyE197NKdqTGabsdv_Ofj9E7HtwcoGZ2_Ll-CLHcIeOm4GyIHdqChDp36c1pKpj7Bm1bUB-Uqp/pub?gid=1300317421&single=true&output=csv"
    };

    function anosDisponiveis() {
        return Object.keys(FONTES_POR_ANO).sort((a, b) => Number(b) - Number(a));
    }

    // ==== ESTADO GLOBAL =====================================================
    let tabela;
    let dadosGlobais = [];
    let carimboAtualizacao = "";

    // ==== UTILITÁRIOS ESPECÍFICOS ============================================

    // "nº/ano" (ex: "15/2026") -> peso para ordenação (ano*1e6 + número).
    // Anos com 2 dígitos são expandidos (26 -> 2026; 98 -> 1998).
    function extrairPesoContrato(nContrato) {
        if (!nContrato || nContrato === "-") return 0;
        const partes = nContrato.split('/');
        if (partes.length !== 2) return 0;

        let numero = parseInt(partes[0].replace(/[^0-9]/g, ''), 10) || 0;
        let ano = parseInt(partes[1].replace(/[^0-9]/g, ''), 10) || 0;

        if (ano < 100) ano += (ano < 50 ? 2000 : 1900);

        return (ano * 1000000) + numero;
    }

    // ==== CARREGAMENTO E PROCESSAMENTO ======================================

    // Campo interno → nome da coluna na planilha, por NOME (não posição).
    const COL = {
        numero:     "numero_contrato",
        documento:  "cpf_ou_cnpj",
        razao:      "razao_social",
        objeto:     "objeto_contrato",
        assinatura: "data_assinatura",
        valor:      "valor_contrato",
        vigencia:   "data_fim_vigencia",
        situacao:   "situacao_contrato",
        modalidade: "modalidade_licitacao",
        fiscal:     "fiscal_contrato",
        linkPdf:    "link_pdf_contrato",
        linkSapl:   "link_processo_sapl",
    };

    function processarCSV(text) {
        const linhas = Papa.parse(text).data;

        let carimbo = "";
        if (linhas.length > 0 && linhas[0][0]) {
            const m = String(linhas[0][0]).match(/(\d{2}\/\d{2}\/\d{4})[,\s]*(\d{2}:\d{2})?/);
            if (m) carimbo = `Dados atualizados em ${m[1]}${m[2] ? ' ' + m[2] : ''}`;
        }

        let ic = 1;
        for (let i = 0; i < Math.min(5, linhas.length); i++) {
            const t = removerAcentos(linhas[i].join(" ").toLowerCase());
            if (t.includes("numero_contrato") || t.includes("razao_social")) { ic = i; break; }
        }

        const idx = indexarColunas(linhas[ic]);
        const posicao = {};
        Object.keys(COL).forEach(campo => { if (COL[campo] in idx) posicao[campo] = idx[COL[campo]]; });

        const faltando = ["numero", "razao", "vigencia"].filter(c => !(c in posicao));
        if (faltando.length) {
            throw new Error("A planilha não tem as colunas esperadas: " + faltando.map(c => COL[c]).join(", ") + ".");
        }

        const pegar = (colunas, campo) => {
            const i = posicao[campo];
            return (i != null && colunas[i] != null) ? String(colunas[i]).trim() : "";
        };
        const hoje = new Date(); hoje.setHours(0, 0, 0, 0);

        const contratos = linhas.slice(ic + 1).map(colunas => {
            const obj = {
                n_contrato:       pegar(colunas, "numero"),
                cpf_cnpj:         pegar(colunas, "documento"),
                razao_social:     pegar(colunas, "razao"),
                objeto_contrato:  pegar(colunas, "objeto"),
                data_contrato:    pegar(colunas, "assinatura"),
                vigencia_contrato:pegar(colunas, "vigencia"),
                situacao_planilha:pegar(colunas, "situacao"),
                modalidade:       pegar(colunas, "modalidade"),
                fiscal:           pegar(colunas, "fiscal"),
                link_pdf:         pegar(colunas, "linkPdf"),
                link_sapl:        pegar(colunas, "linkSapl"),
            };

            obj.valor_num = parseNumeroBR(pegar(colunas, "valor"));
            obj.valor_contrato = isNaN(obj.valor_num) ? "" : formatarBRL(obj.valor_num);

            // Situação: valor da planilha ("Rescindido") tem prioridade;
            // senão calcula por data_fim_vigencia vs hoje.
            const sitPlan = obj.situacao_planilha.trim();
            if (sitPlan) {
                obj.situacao = sitPlan;
            } else {
                const vig = obj.vigencia_contrato.trim();
                const indeterminada = !vig || removerAcentos(vig.toLowerCase()).includes("indetermin");
                const ts = indeterminada ? 0 : dataParaTimestamp(vig);
                if (indeterminada || ts === 0) obj.situacao = "Vigência Indeterminada";
                else obj.situacao = ts >= hoje.getTime() ? "Vigente" : "Encerrado";
            }

            // Modalidade sem números, para agrupar o filtro por tipo
            obj.modalidade_filtro = (obj.modalidade || "")
                .replace(/nº|n°/gi, '').replace(/[\d\/\-\.]+/g, '').replace(/\s+/g, ' ').trim();
            obj.fiscal_filtro = (obj.fiscal || "").trim();
            obj.peso_ordenacao_contrato = extrairPesoContrato(obj.n_contrato);

            const buscaUnificada = `${obj.razao_social} ${obj.cpf_cnpj} ${obj.objeto_contrato} ${obj.n_contrato} ${obj.fiscal} ${obj.modalidade}`;
            obj.busca_indexada = removerAcentos(buscaUnificada.toLowerCase().replace(/\n/g, ' '));
            return obj;
        }).filter(d => d.n_contrato || d.razao_social);

        return { carimbo, contratos };
    }

    async function carregarDados() {
        $('#loader').show(); $('#main-container').hide();
        try {
            const anos = anosDisponiveis();
            if (!anos.length) throw new Error("Nenhuma aba de ano configurada em FONTES_POR_ANO.");

            let anoSel = $('#filtroAnoFonte').val();
            if (!anoSel || !FONTES_POR_ANO[anoSel]) anoSel = anos[0];

            const parte = processarCSV(await buscarCSV(FONTES_POR_ANO[anoSel]));
            dadosGlobais = parte.contratos;
            carimboAtualizacao = parte.carimbo || "Dados sincronizados";

            if (dadosGlobais.length === 0) {
                throw new Error("A planilha foi lida, mas não retornou nenhum contrato.");
            }

            popularFiltrosDinamicos();
            aplicarFiltros();

            $('#badge-atualizacao').text(`🟢 ${carimboAtualizacao}`);
            $('#loader').hide();
            $('#main-container').fadeIn(400, () => enviarAlturaIframe());
        } catch (e) {
            console.error("Erro ao carregar os contratos: ", e);
            $('#loader').html(`<b style="color:#b91c1c">Não foi possível carregar os dados.<br>${escapeHtml(e.message)}<br><br>Tente recarregar a página.</b>`);
        }
    }

    // ==== FILTROS E ORDENAÇÃO ===============================================

    // Opções fixas do filtro de Situação — sempre as três, em todos os anos.
    // "Vigência Indeterminada" entra junto de "Vigente" (ver aplicarFiltros).
    const SITUACOES = ["Vigente", "Encerrado", "Rescindido"];

    function popularFiltrosDinamicos() {
        let modalidades = new Set();
        let fiscais = new Set();

        dadosGlobais.forEach(d => {
            if (d.modalidade_filtro) modalidades.add(d.modalidade_filtro);
            if (d.fiscal_filtro && d.fiscal_filtro !== '-') fiscais.add(d.fiscal_filtro);
        });

        let htmlStatus = '<option value="">Situação</option>';
        SITUACOES.forEach(s => {
            const selected = (s === 'Vigente') ? 'selected' : '';
            htmlStatus += `<option value="${s}" ${selected}>${s}</option>`;
        });
        $('#filtroStatus').html(htmlStatus);

        let htmlMod = '<option value="">Modalidade</option>';
        [...modalidades].sort().forEach(m => {
            htmlMod += `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`;
        });
        $('#filtroModalidade').html(htmlMod);

        let htmlFis = '<option value="">Fiscal</option>';
        [...fiscais].sort().forEach(f => {
            htmlFis += `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`;
        });
        $('#filtroFiscal').html(htmlFis);
    }

    // Situação "Vigente" inclui "Vigência Indeterminada" (mas não
    // "Rescindido", que tem opção própria). Mês usa a data de assinatura.
    function aplicarFiltros() {
        const txt = removerAcentos($('#filtroTexto').val().toLowerCase());
        const sit = $('#filtroStatus').val();
        const mod = $('#filtroModalidade').val();
        const fis = $('#filtroFiscal').val();
        const mes = $('#filtroMes').val();

        const res = dadosGlobais.filter(d => {
            const matchTexto = !txt || d.busca_indexada.includes(txt);

            let matchSit = true;
            if (sit) {
                if (sit === "Vigente") {
                    matchSit = (d.situacao === "Vigente" || d.situacao === "Vigência Indeterminada");
                } else {
                    matchSit = d.situacao === sit;
                }
            }

            const matchMod = !mod || d.modalidade_filtro === mod;
            const matchFis = !fis || d.fiscal_filtro === fis;

            const matchData = !mes || (!!d.data_contrato && d.data_contrato.split('/')[1] === mes);
            return matchTexto && matchSit && matchMod && matchFis && matchData;
        });

        // Vigentes primeiro, rescindidos no meio, encerrados por último;
        // dentro de cada grupo, contrato mais novo (ano/número) primeiro.
        const pesoSituacao = (s) => {
            const t = removerAcentos((s || "").toLowerCase());
            if (t.includes('encerrado')) return 2;
            if (t.includes('rescindido')) return 1;
            return 0;
        };

        res.sort((a, b) => {
            const pa = pesoSituacao(a.situacao);
            const pb = pesoSituacao(b.situacao);

            if (pa !== pb) return pa - pb;
            return b.peso_ordenacao_contrato - a.peso_ordenacao_contrato;
        });

        renderizar(res);
    }

    function limparFiltros() {
        $('#filtroTexto').val('');
        $('select').not('#filtroAnoFonte').val('');
        $('#filtroStatus').val('Vigente');
        aplicarFiltros();
    }

    // ==== TABELA DE CARDS (DataTables) ======================================

    function inicializarTabela() {
        tabela = $('#tabela').DataTable({
            data: [],
            pageLength: 10,
            ordering: false, // ordenação é feita em aplicarFiltros()
            language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json', lengthMenu: "Exibir _MENU_ resultados" },
            dom: 'lrt<"dt-bottom-controls"ip>',
            columns: [{
                data: null,
                render: function(d) {
                    const sitNormalizado = removerAcentos((d.situacao || '').toLowerCase());
                    let statusClass = 'status-ativo';
                    if (sitNormalizado.includes('encerrado')) statusClass = 'status-desligado';
                    else if (sitNormalizado.includes('rescindido')) statusClass = 'status-rescindido';

                    const objetoFormatado = d.objeto_contrato ? escapeHtml(d.objeto_contrato).replace(/\n/g, '<br>') : '-';

                    let numLimpo = (d.cpf_cnpj || '').replace(/\D/g, '');
                    let labelDoc = "CNPJ/CPF";
                    if (numLimpo.length === 11) labelDoc = "CPF";
                    else if (numLimpo.length >= 14) labelDoc = "CNPJ";

                    const cpfCnpjMascarado = mascararCPF(d.cpf_cnpj);
                    const docFormatado = cpfCnpjMascarado && cpfCnpjMascarado !== '-' ? `<span style="font-size: 11px; color: #64748b; font-weight: 600; letter-spacing: 0.5px;">${labelDoc}: ${escapeHtml(cpfCnpjMascarado)}</span>` : '';

                    // Botões de link só aparecem se a célula tiver uma URL
                    // http(s) de verdade (ver urlValida).
                    let htmlBotoesLinks = '';
                    const temPdf = urlValida(d.link_pdf);
                    const temSapl = urlValida(d.link_sapl);

                    if (temPdf || temSapl) {
                        htmlBotoesLinks += `<div class="info-row" style="margin-top: 4px;"><div class="container-links">`;
                        if (temPdf) {
                            htmlBotoesLinks += `<a href="${escapeHtml(d.link_pdf.trim())}" target="_blank" rel="noopener noreferrer" class="btn-link-externo btn-pdf">📄 Ir para o contrato</a>`;
                        }
                        if (temSapl) {
                            htmlBotoesLinks += `<a href="${escapeHtml(d.link_sapl.trim())}" target="_blank" rel="noopener noreferrer" class="btn-link-externo btn-sapl">📁 Ir para a pasta do contrato</a>`;
                        }
                        htmlBotoesLinks += `</div></div>`;
                    }

                    return `
                        <div class="card-info">
                            <div class="card-header">
                                <div class="card-header-texto">
                                    <span class="nome-principal">${escapeHtml(d.razao_social || 'Razão Social Não Informada')}</span>
                                    ${docFormatado}
                                </div>
                                <span class="status-badge ${statusClass}">${escapeHtml(d.situacao || 'N/I')}</span>
                            </div>

                            <div class="card-body">
                                <div class="info-row">
                                    <div class="info-col">
                                        <span class="info-label">Número do Contrato</span>
                                        <span class="info-valor">${escapeHtml(d.n_contrato || '-')}</span>
                                    </div>
                                    <div class="info-col">
                                        <span class="info-label">Modalidade</span>
                                        <span class="info-valor" style="white-space: nowrap;">${escapeHtml(d.modalidade || '-')}</span>
                                    </div>
                                    <div class="info-col">
                                        <span class="info-label">Valor do Contrato</span>
                                        <span class="info-valor">${escapeHtml(d.valor_contrato || '-')}</span>
                                    </div>
                                </div>

                                <div class="info-row">
                                    <div class="info-col">
                                        <span class="info-label">Fiscal</span>
                                        <span class="info-valor">${escapeHtml(d.fiscal || '-')}</span>
                                    </div>
                                    <div class="info-col">
                                        <span class="info-label">Data de Assinatura</span>
                                        <span class="info-valor">${escapeHtml(d.data_contrato || '-')}</span>
                                    </div>
                                    <div class="info-col">
                                        <span class="info-label">${sitNormalizado.includes('rescindido') ? 'Rescindido em' : 'Fim da Vigência'}</span>
                                        <span class="info-valor">${escapeHtml(d.vigencia_contrato || '-')}</span>
                                    </div>
                                </div>

                                <div class="info-row" style="margin-top: 5px;">
                                    <div class="info-col full-width">
                                        <span class="info-label">Objeto do Contrato</span>
                                        <span class="info-valor" style="font-weight: 500; font-size: 12.5px;">${objetoFormatado}</span>
                                    </div>
                                </div>

                                ${htmlBotoesLinks}
                            </div>
                        </div>`;
                }
            }],
            initComplete: function() {
                $('.dataTables_length').appendTo('#comprimento-tabela');
            },
            drawCallback: function() {
                const total = this.api().rows().count();
                $('#contagem-registros').html(`<b>${total}</b> contratos encontrados`);
                enviarAlturaIframe();
            }
        });

        tabela.on('page.dt', function () {
            setTimeout(function() { document.getElementById('painel-visualizacao').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        });
    }

    function renderizar(dados) {
        if (!tabela) inicializarTabela();
        tabela.clear();
        tabela.rows.add(dados);
        tabela.draw();
    }

    // ==== EXPORTAÇÕES (implementação em comum.js, objeto Exportar) =========
    // LGPD: o CPF sai mascarado em TODOS os formatos.

    function dadosParaExportar() {
        return tabela.rows().data().toArray().map(d => ({
            "Nº Contrato": d.n_contrato || '',
            "Razão Social": d.razao_social || '',
            "CNPJ/CPF": mascararCPF(d.cpf_cnpj || ''),
            "Objeto": d.objeto_contrato || '',
            "Data de Assinatura": d.data_contrato || '',
            "Valor": isNaN(d.valor_num) ? '' : d.valor_num,
            "Fim da Vigência": d.vigencia_contrato || '',
            "Situação": d.situacao || '',
            "Modalidade": d.modalidade || '',
            "Fiscal": d.fiscal || '',
            "Link PDF": urlValida(d.link_pdf) ? d.link_pdf.trim() : "",
            "Link SAPL": urlValida(d.link_sapl) ? d.link_sapl.trim() : ""
        }));
    }

    function gerarNomeArquivoBase() {
        let partes = ["contratos", $('#filtroAnoFonte').val()];

        const txt = $('#filtroTexto').val().trim();
        if (txt) partes.push(txt.replace(/\s+/g, '_'));

        const status = $('#filtroStatus').val();
        if (status) partes.push(status);

        return removerAcentos(partes.join('_')).replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
    }

    function exportarCSV()  { Exportar.csv(dadosParaExportar(), gerarNomeArquivoBase()); }
    function exportarXLSX() { Exportar.xlsx(dadosParaExportar(), gerarNomeArquivoBase(), "Contratos"); }
    function exportarJSON() { Exportar.json(dadosParaExportar(), gerarNomeArquivoBase()); }
    function exportarXML()  { Exportar.xml(dadosParaExportar(), gerarNomeArquivoBase(), { raiz: "contratos", item: "contrato" }); }

    // ==== IMPRESSÃO ==========================================================

    function imprimirSeguro() {
        if (!tabela) return;
        const len = tabela.page.len();
        tabela.one('draw.dt', function() {
            setTimeout(() => {
                window.print();
                tabela.page.len(len).draw('page');
            }, 100);
        });
        tabela.page.len(-1).draw('page');
    }

    // ==== INICIALIZAÇÃO ======================================================
    $(document).ready(function() {
        const anos = anosDisponiveis();
        $('#filtroAnoFonte')
            .html(anos.map(a => `<option value="${a}">${a}</option>`).join(''))
            .val(anos[0])
            .on('change', carregarDados);

        let debounceBusca;
        $('#filtroTexto').on('input', function() {
            clearTimeout(debounceBusca);
            debounceBusca = setTimeout(aplicarFiltros, 250);
        });

        $('select').not('#filtroAnoFonte').on('change', aplicarFiltros);

        carregarDados();
    });
</script>
</body>
</html>
